[workspace]
resolver = "3"
members = ["crates/platform-switch", "crates/hello-switch"]

[workspace.package]
edition = "2024"
version = "0.0.1"
authors = ["Wahkah"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wahkah/SlyNX"
