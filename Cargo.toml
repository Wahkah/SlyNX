[workspace]
resolver = "3"
members = [
    "crates/platform-api",
    "crates/platform-switch",
    "crates/hello-switch",
    "crates/formats",
    "crates/render",
    "crates/platform-pc",
    "crates/harness",
    "crates/viewer",
    "crates/audio",
    "crates/engine",
    "crates/script",
    "crates/video",
    "crates/video-bench",
    "crates/ui",
    "crates/packager",
    "crates/save",
    "crates/game",
    "crates/formats-sly2",
    "crates/formats-sly3",
    "crates/stage",
]

[workspace.package]
edition = "2024"
version = "0.0.1"
authors = ["Wahkah"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wahkah/SlyNX"
publish = false

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
