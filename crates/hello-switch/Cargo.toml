[package]
name = "hello-switch"
description = "Platform demo: live input, a test tone, RomFS and save files, CPU boost; runs on the Switch and the PC"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "hello_switch"
path = "src/lib.rs"
# staticlib: linked by tools/build-switch.sh into the .nro. rlib: lets `cargo test` run the scene tests on a PC and
# the PC example use the demo.
crate-type = ["staticlib", "rlib"]

[dependencies]
platform-api = { path = "../platform-api" }

[target.'cfg(target_os = "horizon")'.dependencies]
platform-switch = { path = "../platform-switch" }

[target.'cfg(not(target_os = "horizon"))'.dev-dependencies]
platform-pc = { path = "../platform-pc" }
